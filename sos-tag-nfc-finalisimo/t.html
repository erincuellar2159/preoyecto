<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOS TAG NFC — Ficha de emergencia</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/style.css">
<style>
body{background:var(--bg)}
.top{background:var(--ink);color:#fff;padding:14px 5vw;display:flex;justify-content:space-between;align-items:center;font-weight:900}
.top span{color:var(--red)}.top em{font-style:normal;background:var(--red);font-size:12px;padding:5px 12px;border-radius:99px}
.wrap{max-width:860px;margin:20px auto;padding:0 14px}
.ficha{animation:none;margin-top:0}
.call{background:var(--ok);color:#fff;text-decoration:none;font-weight:700;padding:8px 16px;border-radius:10px;float:right}
.aviso{display:block;text-align:center;margin:18px 0 6px;background:var(--red);color:#fff;text-decoration:none;font-weight:800;font-size:18px;padding:16px;border-radius:12px}
.aviso.off{opacity:.6;pointer-events:none}
.estado{text-align:center;font-size:14px;color:var(--mut);margin:6px 0 0}
.foot{text-align:center;color:var(--mut);font-size:13px;margin:14px 0}
</style>
</head>
<body>
<div class="top"><div>SOS <span>TAG</span> NFC</div><em>FICHA DE EMERGENCIA</em></div>
<div class="wrap"><div class="ficha" id="root">Cargando ficha…</div><div class="foot" id="foot"></div></div>
<script>
const id = decodeURIComponent(location.pathname.split('/').pop());
const root = document.getElementById('root');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const chips = (a, cls = '') => `<p class="chips ${cls}">${a.map(x => `<span>${esc(x)}</span>`).join('')}</p>`;
let ficha = null, pos = null;

fetch('/api/index?action=tag&id=' + encodeURIComponent(id))
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(render)
  .catch(() => root.textContent = 'Tag no encontrado o no activo.');

function render(p) {
  ficha = p;
  const ini = p.name.split(' ').slice(0, 2).map(w => w[0]).join('');
  root.innerHTML = `
  <div class="ficha-head"><div class="avatar">${esc(ini)}</div>
    <div><h3>${esc(p.name)}</h3><p>${[p.age ? p.age + ' años' : '', p.role, p.city].filter(Boolean).map(esc).join(' · ')}</p></div>
    <div class="blood"><small>TIPO DE SANGRE</small><b>${esc(p.blood)}</b></div></div>
  <div class="ficha-body"><div>
    <h4>Alergias</h4>${chips(p.allergies, 'r')}
    <h4>Padecimientos</h4>${chips(p.conditions)}
    <h4>Medicamentos</h4>${chips(p.meds)}</div>
  <div><h4>Contactos de emergencia</h4><ul class="contacts">
    ${p.contacts.map(c => `<li><a class="call" href="tel:${esc(c.tel)}">Llamar</a><b>${esc(c.name)}</b><small>${esc(c.rel)}</small></li>`).join('')}
    ${p.insurance ? `<li><b>${esc(p.insurance.name)}</b><small>${p.insurance.policy ? 'Póliza #' + esc(p.insurance.policy) : 'Seguro'}</small></li>` : ''}
  </ul></div></div>
  <a class="aviso off" id="aviso" href="#">📍 Obteniendo ubicación…</a>
  <p class="estado" id="estado">Toca el botón para abrir el SMS a tus contactos con la ubicación ya escrita. Tú solo tienes que enviarlo.</p>`;
  document.getElementById('foot').textContent = 'Leído vía NFC/QR · SOS TAG NFC';
  getPos().then(p => { pos = p; prepararAviso(); });
}

function getPos() {
  return new Promise(res => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition(
      p => res({ lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy }),
      () => res(null),
      { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 });
  });
}

function textoAviso() {
  const hora = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
  const loc = pos
    ? `Ubicación: https://maps.google.com/?q=${pos.lat.toFixed(5)},${pos.lon.toFixed(5)}${Number.isFinite(pos.acc) ? ' (±' + Math.round(pos.acc) + ' m)' : ''}`
    : 'Ubicación no disponible (no se permitió el GPS).';
  const alergias = ficha.allergies.length ? ', alergias: ' + ficha.allergies.join(', ') : '';
  return `🚨 SOS TAG: ${ficha.name} fue escaneada tras un posible percance (${hora}). ${loc} Tipo ${ficha.blood}${alergias}.`;
}

// Abre la app de SMS con los números y el texto ya escritos. El usuario solo toca "Enviar".
// iOS y Android usan separadores distintos para el cuerpo del mensaje.
function prepararAviso() {
  const a = document.getElementById('aviso');
  const nums = ficha.contacts.map(c => c.tel).join(',');
  const sep = /iPhone|iPad|iPod/.test(navigator.userAgent) ? '&' : '?';
  a.href = `sms:${nums}${sep}body=${encodeURIComponent(textoAviso())}`;
  a.classList.remove('off');
  a.textContent = '📍 Avisar a mis contactos por SMS';
  document.getElementById('estado').textContent = pos
    ? 'Ubicación lista. Toca el botón y luego "Enviar" en tu app de mensajes.'
    : 'No se obtuvo la ubicación. El mensaje saldrá sin ella; toca el botón y luego "Enviar".';
}
</script>
</body>
</html>
