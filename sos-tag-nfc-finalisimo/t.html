<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOS TAG NFC — Ficha de emergencia</title>
<meta name="robots" content="noindex">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="theme.css">
<style>iframe{filter:saturate(.9) contrast(1.02)}</style>
</head>
<body class="bg-app min-h-screen text-white antialiased">

<header class="sticky top-0 z-20 border-b border-white/10 bg-indigo-950/40 backdrop-blur-xl">
  <div class="mx-auto flex max-w-3xl items-center justify-between px-4 py-3">
    <a href="/" class="flex items-center gap-2 font-black tracking-wide">
      <span class="grid h-8 w-8 place-items-center rounded-lg bg-gradient-to-br from-rose-500 to-orange-400 text-sm">🚑</span>
      SOS <span class="text-rose-400">TAG</span> NFC
    </a>
    <span class="rounded-full bg-rose-500 px-3 py-1 text-xs font-bold tracking-wider">FICHA DE EMERGENCIA</span>
  </div>
</header>

<main class="mx-auto max-w-3xl space-y-5 px-4 pb-16 pt-6">
  <div id="root" class="space-y-5">
    <div class="glass rounded-3xl p-6"><div class="skeleton h-6 w-48 rounded"></div><div class="skeleton mt-4 h-24 rounded-2xl"></div></div>
  </div>
  <p id="foot" class="pt-4 text-center text-xs text-white/50"></p>
</main>

<script>
const id = decodeURIComponent(location.pathname.split('/').pop());
const modoAuxilio = new URLSearchParams(location.search).get('aux') === '1';
const root = document.getElementById('root');
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let ficha = null, pos = null;

fetch('/api/index?action=tag&id=' + encodeURIComponent(id))
  .then(r => r.ok ? r.json() : Promise.reject())
  .then(p => { ficha = p; render(p); locate(); })
  .catch(() => {
    root.innerHTML = `<div class="glass rounded-3xl p-8 text-center"><p class="text-4xl">🔎</p><h2 class="mt-3 text-xl font-bold">Tag no encontrado</h2><p class="mt-1 text-white/70">Este código no está activo o fue dado de baja.</p></div>`;
  });

const chips = (arr, tone) => arr.length
  ? arr.map(x => `<span class="rounded-full px-3 py-1 text-sm font-semibold ${tone}">${esc(x)}</span>`).join('')
  : '<span class="text-sm text-white/50">Ninguno registrado</span>';

function render(p) {
  const ini = p.name.split(' ').slice(0, 2).map(w => w[0]).join('');
  const banner = modoAuxilio
    ? `<section class="glass rounded-3xl p-5 ring-2 ring-rose-400/60">
         <p class="text-sm font-black uppercase tracking-widest text-rose-200">Modo auxilio</p>
         <p class="mt-1 text-white/80">Llama al 911 si la persona está en peligro. Luego avisa a sus contactos con tu ubicación.</p>
         <div class="mt-4 grid gap-3 sm:grid-cols-2">
           <a href="tel:911" class="btn-cta rounded-2xl bg-rose-600 px-5 py-4 text-center text-lg font-black shadow-xl shadow-rose-900/50">📞 Llamar al 911</a>
           <a id="aviso-top" href="#" class="btn-cta pointer-events-none rounded-2xl bg-gradient-to-r from-orange-400 to-amber-300 px-5 py-4 text-center text-lg font-black text-slate-900 opacity-60">✉️ Avisar a sus contactos</a>
         </div>
       </section>` : '';

  root.innerHTML = `
    ${banner}
    <section class="glass rounded-3xl p-6 sm:p-8">
      <div class="flex flex-col gap-5 sm:flex-row sm:items-center sm:justify-between">
        <div class="flex items-center gap-4">
          <div class="grid h-16 w-16 shrink-0 place-items-center rounded-2xl bg-gradient-to-br from-rose-500 to-orange-400 text-xl font-black shadow-lg">${esc(ini)}</div>
          <div>
            <h1 class="text-2xl font-black leading-tight">${esc(p.name)}</h1>
            <p class="text-sm text-white/70">${[p.age ? p.age + ' años' : '', p.role, p.city].filter(Boolean).map(esc).join(' · ')}</p>
          </div>
        </div>
        <div class="flex items-center gap-3 self-start rounded-2xl bg-rose-500/20 px-5 py-3 ring-1 ring-rose-400/40">
          <span class="text-xs font-bold tracking-widest text-rose-200">TIPO DE SANGRE</span>
          <span class="text-3xl font-black">${esc(p.blood)}</span>
        </div>
      </div>
    </section>

    <div class="grid gap-5 md:grid-cols-2">
      <section class="glass rounded-3xl p-6">
        <h2 class="mb-3 text-sm font-bold uppercase tracking-widest text-white/60">Alergias</h2>
        <div class="flex flex-wrap gap-2">${chips(p.allergies, 'bg-rose-500/25 text-rose-100 ring-1 ring-rose-400/40')}</div>
        <h2 class="mb-3 mt-6 text-sm font-bold uppercase tracking-widest text-white/60">Padecimientos</h2>
        <div class="flex flex-wrap gap-2">${chips(p.conditions, 'bg-white/10 ring-1 ring-white/20')}</div>
        <h2 class="mb-3 mt-6 text-sm font-bold uppercase tracking-widest text-white/60">Medicamentos</h2>
        <div class="flex flex-wrap gap-2">${chips(p.meds, 'bg-white/10 ring-1 ring-white/20')}</div>
      </section>

      <section class="glass rounded-3xl p-6">
        <h2 class="mb-3 text-sm font-bold uppercase tracking-widest text-white/60">Contactos de emergencia</h2>
        <ul class="space-y-3">
          ${p.contacts.map(c => `
            <li class="flex items-center justify-between gap-3 rounded-2xl bg-white/5 p-3 ring-1 ring-white/10 transition hover:-translate-y-0.5 hover:bg-white/10">
              <div class="min-w-0">
                <p class="truncate font-bold">${esc(c.name)}</p>
                <p class="text-xs text-white/60">${esc(c.rel)}</p>
              </div>
              <a href="tel:${esc(c.tel)}" class="shrink-0 rounded-xl bg-emerald-500 px-4 py-2 text-sm font-bold shadow-lg shadow-emerald-900/40 transition hover:bg-emerald-400">Llamar</a>
            </li>`).join('')}
        </ul>
        ${p.insurance ? `<div class="mt-4 rounded-2xl bg-white/5 p-3 text-sm ring-1 ring-white/10"><b>${esc(p.insurance.name)}</b><span class="block text-xs text-white/60">${p.insurance.policy ? 'Póliza #' + esc(p.insurance.policy) : 'Seguro'}</span></div>` : ''}
      </section>
    </div>

    <section class="glass rounded-3xl p-6">
      <div class="mb-4 flex flex-wrap items-center justify-between gap-3">
        <div>
          <h2 class="text-lg font-black">📍 Dónde fue escaneado</h2>
          <p id="loc-estado" class="text-sm text-white/70">Obteniendo ubicación…</p>
        </div>
        <button id="retry" class="hidden rounded-xl bg-white/10 px-4 py-2 text-sm font-semibold ring-1 ring-white/20 transition hover:bg-white/20">Reintentar ubicación</button>
      </div>
      <div class="relative overflow-hidden rounded-2xl ring-1 ring-white/15">
        <div id="map-placeholder" class="skeleton grid h-64 place-items-center text-sm text-white/60">Esperando ubicación…</div>
        <iframe id="map" class="hidden h-64 w-full border-0" loading="lazy" title="Mapa de la ubicación"></iframe>
      </div>
      <div class="mt-4 flex flex-col gap-3 sm:flex-row">
        <a id="aviso" href="#" class="btn-cta flex-1 pointer-events-none rounded-2xl bg-gradient-to-r from-rose-500 to-orange-400 px-5 py-4 text-center font-black shadow-lg shadow-rose-900/40 opacity-60">✉️ Avisar a mis contactos por SMS</a>
        <a id="gmaps" href="#" target="_blank" rel="noopener" class="hidden flex-1 rounded-2xl bg-white/10 px-5 py-4 text-center font-bold ring-1 ring-white/20 transition hover:bg-white/20">Abrir en Google Maps</a>
      </div>
      <p class="mt-3 text-center text-xs text-white/50">El SMS sale desde tu celular con el texto ya escrito. Solo toca "Enviar".</p>
    </section>`;

  document.getElementById('foot').textContent = 'Leído vía NFC/QR · SOS TAG NFC';
  document.getElementById('retry').onclick = locate;
  document.querySelectorAll('.reveal').forEach(el => el.classList.add('show'));
}

function locate() {
  const est = document.getElementById('loc-estado');
  document.getElementById('retry').classList.add('hidden');
  if (!navigator.geolocation) return sinUbicacion('Este navegador no permite ubicación. El aviso saldrá sin mapa.');
  est.textContent = 'Pidiendo permiso de ubicación…';
  navigator.geolocation.getCurrentPosition(
    p => {
      pos = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy };
      mostrarMapa();
      est.textContent = `Ubicación lista · precisión de ±${Math.round(pos.acc)} m`;
      prepararAviso();
    },
    () => sinUbicacion('No se dio permiso de ubicación. El aviso saldrá sin mapa.'),
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
}

function sinUbicacion(msg) {
  document.getElementById('loc-estado').textContent = msg;
  document.getElementById('retry').classList.remove('hidden');
  prepararAviso();
}

function mostrarMapa() {
  const d = 0.004;
  const map = document.getElementById('map');
  map.src = `https://www.openstreetmap.org/export/embed.html?bbox=${pos.lon - d},${pos.lat - d},${pos.lon + d},${pos.lat + d}&layer=mapnik&marker=${pos.lat},${pos.lon}`;
  map.classList.remove('hidden');
  document.getElementById('map-placeholder').classList.add('hidden');
  const g = document.getElementById('gmaps');
  g.href = `https://maps.google.com/?q=${pos.lat.toFixed(5)},${pos.lon.toFixed(5)}`;
  g.classList.remove('hidden');
}

// Texto corto y claro para el SMS. Sin emojis, para que se entienda en cualquier celular.
function textoAviso() {
  const hora = new Date().toLocaleTimeString('es-MX', { hour: '2-digit', minute: '2-digit' });
  const lugar = pos
    ? `Su tag fue escaneado en este lugar:\nhttps://maps.google.com/?q=${pos.lat.toFixed(5)},${pos.lon.toFixed(5)} (precisión ±${Math.round(pos.acc)} m)`
    : 'Su tag fue escaneado, pero no se pudo obtener la ubicación.';
  const alergias = ficha.allergies.length ? `\nAlergias: ${ficha.allergies.join(', ')}.` : '';
  return `AYUDA - SOS TAG\n${ficha.name} podría necesitar ayuda.\n${lugar}\nHora: ${hora}\nTipo de sangre: ${ficha.blood}.${alergias}\nSi no puedes comunicarte con ella, llama al 911.`;
}

// Abre la app de SMS con los números y el texto ya escritos. iOS y Android usan separadores distintos.
function prepararAviso() {
  const nums = ficha.contacts.map(c => c.tel).join(',');
  const sep = /iPhone|iPad|iPod/.test(navigator.userAgent) ? '&' : '?';
  const href = `sms:${nums}${sep}body=${encodeURIComponent(textoAviso())}`;
  for (const sel of ['aviso', 'aviso-top']) {
    const a = document.getElementById(sel);
    if (!a) continue;
    a.href = href;
    a.classList.remove('pointer-events-none', 'opacity-60');
  }
}
</script>
</body>
</html>
